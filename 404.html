<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex">
<title>Page introuvable — Patricia Veranneman</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0D0D0D;color:#EDE9E2;
    font-family:'Jost','Helvetica Neue',system-ui,sans-serif;font-weight:300;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2rem;
    -webkit-font-smoothing:antialiased;
  }
  .n{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(4rem,14vw,9rem);line-height:1;letter-spacing:-.03em;opacity:.22}
  p.t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.3rem,3.4vw,2rem);margin:1.5rem 0 .75rem}
  p.s{font-size:.85rem;line-height:1.8;color:rgba(237,233,226,.55);max-width:34ch;margin:0 auto}
  a{
    display:inline-block;margin-top:2.5rem;
    font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
    color:#C4A06B;text-decoration:none;
    border:1px solid #C4A06B;padding:1rem 2.25rem;
    transition:background .25s,color .25s;
  }
  a:hover{background:#C4A06B;color:#0D0D0D}
</style>
</head>
<body>
  <main>
    <p class="n">404</p>
    <p class="t">Cette page n'existe pas</p>
    <p class="s">Le lien est peut-être ancien, ou l'adresse mal recopiée. La galerie, elle, est toujours là.</p>
    <a href="/">Retour à la galerie</a>
  </main>
</body>
</html>
