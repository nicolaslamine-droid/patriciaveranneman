hero_bio:
  fr: Artiste belge, Patricia Veranneman travaille la peinture et la céramique à partir de ce qui a déjà
    vécu — une photographie ancienne, un objet oublié, un fragment de mémoire — qu'elle déplace et recompose
    jusqu'à devenir autre chose.
  en: A Belgian artist, Patricia Veranneman works in painting and ceramics from what has already lived —
    an old photograph, a forgotten object, a fragment of memory — which she displaces and recomposes until
    it becomes something else.
hero_sur:
  fr: Peinture & Céramique · Belgique
  en: Painting & Ceramics · Belgium
intro_manifeste:
  fr: Entre mémoire & matière
  en: Between memory & matter
intro_citation:
  fr: 'Le temps n''est jamais figé : il se dépose, se fissure, se transforme et <em>recommence</em>.'
  en: 'Time is never fixed: it settles, it cracks, it transforms and <em>begins again</em>.'
apropos:
- fr: 'À travers la peinture et la céramique, Patricia Veranneman explore les traces du temps, les fragments
    de mémoire et les transformations de la matière. Son travail part souvent de ce qui existe déjà :
    une photographie ancienne, un objet oublié, un élément trouvé, une forme qui porte en elle une histoire.
    Ces fragments ne sont pas reproduits — ils sont déplacés, transformés, recomposés, jusqu''à devenir
    autre chose.'
  en: 'Through painting and ceramics, Patricia Veranneman explores the traces of time, fragments of memory
    and the transformations of matter. Her work often starts from what already exists: an old photograph,
    a forgotten object, a found element, a form that carries a story within it. These fragments are not
    reproduced — they are displaced, transformed, recomposed, until they become something else.'
- fr: 'Ses peintures s''appuient parfois sur d''anciennes photographies : images familiales, scènes anonymes,
    souvenirs dont il ne reste qu''une trace. Le passage de la photographie à la peinture introduit une
    distance. Les contours s''effacent, des détails disparaissent ; ce qui était une image précise devient
    une impression, une présence, parfois une absence.'
  en: 'Her paintings sometimes begin from old photographs: family pictures, anonymous scenes, memories
    of which only a trace remains. Moving from photograph to painting introduces a distance. Outlines
    fade, details disappear; what was a precise image becomes an impression, a presence, sometimes an
    absence.'
- fr: 'La céramique aborde ces mêmes questions par la matière et le volume. Des éléments anciens, trouvés
    ou porteurs d''une histoire, sont assemblés à la terre et confrontés à une forme nouvelle : ni conservés
    intacts, ni tout à fait effacés. Les pièces portent alors plusieurs temps à la fois, entre vestige
    et création.'
  en: 'Ceramics take up these same questions through material and volume. Old elements, found or carrying
    a story, are joined to the clay and set against a new form: neither kept intact nor quite erased.
    The pieces then hold several times at once, between relic and creation.'
installation:
- fr: Intervention dans l'espace public — les pièces de Patricia dialoguent avec le bâti et le paysage,
    investissant l'extérieur comme prolongement naturel du travail en atelier.
  en: Intervention in public space — Patricia's pieces converse with the building and the landscape, taking
    the outdoors as a natural extension of the studio.
- fr: Quatre sphères en grès émaillé, une par élément — la Terre, l'Eau, l'Air, le Feu — posées sur les
    pilastres d'une grille d'entrée.
  en: Four glazed stoneware spheres, one for each element — Earth, Water, Air, Fire — set on the pilasters
    of an entrance gate.
expositions:
- fr: Peintures accrochées aux cimaises, sculptures posées sur leurs socles — les œuvres de Patricia Veranneman
    ont été présentées dans des galeries et espaces culturels en Belgique et à l'étranger.
  en: Paintings on the walls, sculptures on their plinths — Patricia Veranneman's work has been shown
    in galleries and cultural venues in Belgium and abroad.
