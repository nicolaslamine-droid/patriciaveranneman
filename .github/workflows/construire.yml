# Reconstruit et publie le site à chaque modification du contenu.
# Réglage nécessaire une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Construire et publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --quiet "pillow>=12" pyyaml
      - name: Construire le site
        run: python _outils/construire.py
      - name: Vérifier le résultat
        run: |
          test -s index.html
          test -s en/index.html
          test -s sitemap.xml
          test "$(find oeuvres -name index.html | wc -l)" -gt 10
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
